[project]
name = "rumble-test"
version = "0.1.0"
description = ""
authors = [
    {name = "Darko Kolev",email = "kolevdarko@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn (>=0.47.0,<0.48.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "greenlet (>=3.5.1,<4.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
]

[project.scripts]
fetch-employees = "app.cli_fetch:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "app" },
]
[tool.poetry.group.dev.dependencies]
mypy = "^2.1.0"
pytest = "^9.0.3"
ruff = "^0.15.14"
faker = "^40.19.1"
anyio = "^4.13.0"
respx = "^0.23.1"
pre-commit = "^4.6.0"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "server"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"app/**/router.py" = ["B008"]
"server/**/routers/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "server"]

[tool.mypy]
python_version = "3.12"
files = ["app", "server"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

